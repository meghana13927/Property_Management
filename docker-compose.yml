services:
  db:
    image: postgres:15
    container_name: property_management_db

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo

    volumes:
      - odoo-db-data:/var/lib/postgresql/data

    ports:
      - "8069:8069"

    restart: unless-stopped


  odoo:
    image: odoo:19.0
    container_name: property_management_odoo

    depends_on:
      - db

    network_mode: "service:db"

    environment:
      HOST: 127.0.0.1
      USER: odoo
      PASSWORD: odoo

    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extra-addons

    restart: unless-stopped


volumes:
  odoo-web-data:
  odoo-db-data: